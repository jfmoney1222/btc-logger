name: log-predictions
on:
  schedule:
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: logger
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python predict.py
      - name: Save results
        run: |
          git config user.name "logger-bot"
          git config user.email "logger-bot@users.noreply.github.com"
          git add predictions.csv
          git diff --cached --quiet || (git commit -m "log" && git pull --rebase && git push)
